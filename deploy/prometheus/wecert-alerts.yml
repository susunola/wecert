# Prometheus alerting rules for wecert.
#
# Why this file ships with the program instead of living in the documentation. The metrics are
# documented as *the* operational signal -- "alert on not_after, not on whether the renewal job
# errored", because the error path stays silent when the program is quietly broken -- and yet the
# only PromQL in the repository was two lines in a markdown table. An operator had to transcribe
# thresholds out of prose, which is how thresholds drift from the code that defines them.
#
# Load with:
#
#   rule_files:
#     - /etc/wecert/alerts.yml
#
# Thresholds are NOT invented here: they are `config.ExpiryWarningThreshold`, which is a quarter of
# each profile's validity -- 22.5 days for classic (90d), 11.25 for tlsserver (45d), 40 hours for
# shortlived (160h). A fixed window was tried and rejected: 21 days is most of a shortlived
# certificate's life, so that profile alerted from issuance onwards and trained people to ignore it.

# ── Which of these rules can fire in timer mode ────────────────────────────────────────────────
#
# 13 of the rules below carry a `for:` and read a series the daemon exports continuously. In the
# documented alternative deployment -- `wecert-once.timer`, one process per hour -- /metrics only
# exists for the seconds the pass takes, so those rules can never observe a sustained condition, and
# the timer's unit status is the only channel that reports a bad pass. That is not a defect in the
# rules; it is a property of the mode, and it has to be said out loud because the failure it hides is
# "the timer is green and nothing is being renewed".
#
# In timer mode, alert on the unit instead (node_exporter's systemd collector):
#
#   - alert: WecertTimerUnitFailed
#     expr: node_systemd_unit_state{name="wecert-once.service",state="failed"} == 1
#     for: 5m
#     labels: {severity: critical}
#     annotations:
#       summary: "the last wecert-once run did not converge"
#       description: >-
#         Check `journalctl -u wecert-once` and `systemctl status wecert-once`. A pass that converged
#         nothing (including one where every certificate was inside its retry backoff) exits non-zero
#         by design, so a failed unit is the timer-mode equivalent of WecertHasNotReconciledRecently.
#
# The rules that DO work in either mode are the ones whose state wecert pushes out of band: the
# webhook notification (result, cert, error) and the exit code -- which is why the renewal-result
# webhook is worth configuring even when the daemon is not used.

groups:
  - name: wecert.expiry
    rules:
      # The primary signal. Three rules rather than one, because the profiles have genuinely
      # different lifetimes and a single threshold would either be late for shortlived or noise for
      # classic.
      #
      # Each threshold is a quarter of the profile's nominal validity -- the same number the daemon
      # logs a warning at (config.ExpiryWarningThreshold), so the log line and the alert agree.
      # They are calibrated to the profile DEFAULTS, and Prometheus cannot see the config: a
      # certificate whose renewBefore was set shorter than its threshold will trip this before its
      # renewal is due, and ARI can move the renewal window later still. The descriptions below
      # therefore say what to check rather than asserting that renewal has failed.
      #
      # `> 0` guards the series being absent rather than zero. The metric is now deleted for a
      # certificate that has never been issued -- exporting 0 made this comparison true at roughly
      # -20,700 days, so every new certificate paged someone about a certificate that did not exist
      # yet. The guard is defence in depth for anyone re-implementing the exporter.
      # Each rule selects its own profile: the profiles have different validities (90 days classic,
      # 45 tlsserver, 160 hours shortlived), so a single threshold either fires for a short-lived
      # certificate's entire life or is late for it. The profile label is what makes one rule per
      # profile possible -- without it, "expires in under 22.5 days" was true for every short-lived
      # certificate from the moment it was issued.
      - alert: WecertCertificateExpiringClassic
        expr: |
          (wecert_certificate_not_after_timestamp_seconds{profile="classic"} > 0)
          and
          (wecert_certificate_not_after_timestamp_seconds{profile="classic"} - time()) / 86400 < 22.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "certificate {{ $labels.cert }} expires in under 22.5 days"
          description: >-
            The classic profile renews 30 days ahead by default and this fires at 22.5 days, so with
            the default it means renewal is a week overdue. Check
            wecert_certificate_consecutive_failures: if that is climbing, renewal is failing; if it
            is 0, this certificate's renewBefore is shorter than 22.5 days and the alert is simply
            early.

      - alert: WecertCertificateExpiringTLSServer
        expr: |
          (wecert_certificate_not_after_timestamp_seconds{profile="tlsserver"} > 0)
          and
          (wecert_certificate_not_after_timestamp_seconds{profile="tlsserver"} - time()) / 86400 < 11.25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "certificate {{ $labels.cert }} expires in under 11.25 days"
          description: >-
            The tlsserver profile renews 15 days ahead by default; this is a week past that. If
            wecert_certificate_consecutive_failures is 0 the renewal is merely not due yet.

      - alert: WecertCertificateExpiringShortLived
        expr: |
          (wecert_certificate_not_after_timestamp_seconds{profile="shortlived"} > 0)
          and
          (wecert_certificate_not_after_timestamp_seconds{profile="shortlived"} - time()) / 3600 < 40
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "certificate {{ $labels.cert }} expires in under 40 hours"
          description: >-
            A short-lived certificate renews 48 hours ahead by default, so 40 hours left is past
            that. This profile is used precisely where a lapse is immediate, so treat it as urgent
            even if wecert_certificate_consecutive_failures is still 0.

      # Deployed but not serving a usable copy of the certificate wecert deployed.
      #
      # This is the failure the state database cannot see: the API said the rebind succeeded, and
      # the TLS handshake serves something else. It is the reason the probe exists.
      #
      # "Not usable" includes a chain no client accepts: probe.requireTrusted (on by default)
      # reports probe_match = 0 for a listener serving the leaf without its intermediate, which
      # IS the deployed certificate. The annotation below says so, because the fix for that one
      # is on the listener, not in wecert.
      - alert: WecertServedCertificateIsNotTheDeployedOne
        expr: wecert_certificate_probe_match == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} is not serving a usable copy of the certificate wecert deployed"
          description: >-
            Either the rebind did not take effect, another certificate is winning SNI, the
            certificate that is deployed is below probe.minValidFor (in which case it IS the
            deployed one and the log line says so), or its chain does not verify against the
            system roots -- probe.requireTrusted, on by default, counts "the right certificate
            served without its intermediate" as a mismatch too, because no client accepts it.
            Set probe.requireTrusted: false when the CA is internal and cannot chain to a public
            root. The journal carries the per-address reason:
            wecert_certificate_probe_match == 0 with wecert_certificate_probe_errors_total flat
            means every address answered. To compare expiries by hand, find the certificate whose
            SANs cover {{ $labels.host }} (the config, the desired-state document, or
            wecert_desired_state_certificates) and read
            wecert_certificate_not_after_timestamp_seconds{cert="..."} -- the probe family is
            labelled by host and the desired-state family by cert, so there is no join.

      # The probe could not run. This is an environment problem, not a certificate problem, and
      # keeping the two apart is why they are separate metrics.
      - alert: WecertProbeCannotReachTheEndpoints
        # Six hours, not one: a probe error is one increment per host per pass, and passes run
        # hourly -- so `> 3` over one hour could never be reached by a single failing host, and the
        # warning that exists to say "this is an environment problem, not a certificate problem"
        # never fired. Six hours of a persistently failing probe is the signal.
        expr: increase(wecert_certificate_probe_errors_total[6h]) > 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "the probe cannot reach {{ $labels.host }}"
          description: >-
            Resolve, dial or handshake failed repeatedly. If wecert runs where it cannot reach the
            VIP, either disable probe.enabled or run wecert-probe from a host that can; leaving it on
            produces this alert and no useful evidence.

  - name: wecert.convergence
    rules:
      # Renewal is failing and has been for a while. The severity escalates with the failure count
      # because the backoff is exponential: five consecutive failures is already hours of waiting.
      - alert: WecertRenewalFailing
        expr: wecert_certificate_consecutive_failures >= 5
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "renewal for {{ $labels.cert }} has failed {{ $value }} times in a row"
          description: >-
            Check the daemon log and `wecert_preflight -domain` for this certificate. If the failure
            is a DNS authorization, the identifier ledger is what the pre-expiry fallback uses to
            decide which names to drop.

      - alert: WecertFallbackIsDroppingNames
        expr: wecert_certificate_fallback_active == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          # No {{ $value }} here: this expression is `== 1`, so the value is always 1 and the summary
          # said "missing 1 name(s)" no matter how many were dropped. The count lives in
          # wecert_certificate_fallback_dropped_names, which a template cannot join to.
          summary: "{{ $labels.cert }} is in failure fallback: a partial certificate is planned or serving"
          description: >-
            A degradation decision is in force for this certificate: the names whose authorizations
            keep failing have been dropped, so the certificate it serves (or is about to serve) is
            partial. The dropped count is wecert_certificate_fallback_dropped_names; the identifiers
            themselves are in the log and in wecert_desired_state_*.

      # "Nothing is happening" is its own failure mode, and no error counter sees it: the daemon can
      # be up, healthy-looking, and issuing nothing.
      #
      # This used to read wecert_reconcile_total_created_timestamp, which is not a series that
      # exists: the exposition is the classic text format, which carries no _created timestamps at
      # all. The alert could never fire.
      # `> 0` matters: the gauge is published on the first pass and starts at zero, so without the
      # guard this fired half an hour after every process start -- before a first pass could have
      # finished -- with the message "no pass has finished in over 2 hours". A first pass that
      # legitimately takes longer than 30 minutes (a large fleet, a slow CA) then paged for a
      # process that was working normally.
      - alert: WecertHasNotReconciledRecently
        expr: (wecert_last_reconcile_timestamp_seconds > 0) and (time() - wecert_last_reconcile_timestamp_seconds) > 7200
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "no reconcile pass has finished in over 2 hours"
          description: >-
            The daemon converges hourly by default. Either it is not running, or it is running and
            stuck: wecert_last_reconcile_timestamp_seconds is stamped when a pass finishes and never
            when one starts, so a hung pass goes stale exactly like a dead process. 0 means no pass
            has finished since startup. This alert is deliberately not derived from an error counter:
            silence is the failure it is looking for.

      - alert: WecertDocumentsAreStale
        expr: wecert_desired_state_age_seconds > 172800
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "the desired-state document has not been refreshed in over 48 hours"
          description: >-
            wecert keeps renewing from the old document, so nothing looks broken -- but no newly
            declared name will ever be picked up. The generator (wecert-onboard) has probably stopped
            running.

      - alert: WecertDocumentSourceIsFailing
        expr: increase(wecert_desired_state_errors_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "the desired-state source could not be read"
          description: >-
            A source failure freezes the previous revision rather than emptying it, so this is safe
            but not healthy: no configuration change takes effect until it is readable again.

      - alert: WecertStateIsFrozen
        expr: wecert_desired_state_frozen == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "the desired state has been frozen for over 2 hours"
          description: >-
            A freeze is deliberate -- an abrupt declaration drop, an over-cap group, an unreadable
            document -- and it means configuration changes are not being applied. Identify the reason
            from the log, fix it, and re-run the generator.

  - name: wecert.integrity
    rules:
      # A recovered panic is always a bug, never routine churn. The pass survived, which is the
      # design working, but something in the state machine is wrong.
      - alert: WecertReconcilePanicked
        expr: increase(wecert_reconcile_panics_total[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "a reconcile pass panicked for {{ $labels.cert }}"
          description: >-
            The panic was recovered so other certificates are unaffected, and the daemon logged a
            stack trace. This is a bug: report it with that trace. The affected pass was retried on
            its usual backoff.

      - alert: WecertOrphanedCertificates
        expr: wecert_orphaned_certificates > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} certificate(s) are in the state store but not the desired state"
          description: >-
            They will not be renewed and will expire, and their DNS challenge records were reclaimed.
            If that was not intended, restore the declaration and re-run wecert-onboard.

      # The CA refused a request and told us when it will listen again. That instant is
      # authoritative -- it accounts for every other account spending the same global bucket, which
      # the local estimate cannot see. The paused-identifier refusal is the one exception: it names
      # no instant, so what the gauge reports for it is our one-day floor (see the description).
      - alert: WecertRateLimitBlocked
        expr: wecert_ratelimit_blocked == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.limit }} is refusing requests until the CA's deadline"
          description: >-
            Issuance for the affected scope is paused until the reported time. The exact-set limit
            (5 per 7 days) has no override; the per-account order and per-registered-domain limits can
            be raised through Let's Encrypt's rate-limit adjustment form, which takes weeks. One
            limit behaves differently: `consecutive-authz-failures-per-identifier` means the CA has
            PAUSED that identifier after repeated failed authorizations, its refusal names no instant,
            and the reported time is a one-day floor rather than the CA's answer -- waiting does not
            lift it, so unpause it in the CA's self-service portal (the journal line for the refusal
            has the link).

      # The threshold is one token, not five: the exact-identifier-set limit (5 per 7 days,
      # refilling one every 34 hours) and the per-identifier failure budget (5 per hour) both have a
      # capacity of five, so `remaining < 5` was true for roughly a day and a half after every
      # single issuance -- a warning that is on half the time is not a warning.
      - alert: WecertRateLimitNearlyExhausted
        expr: wecert_ratelimit_remaining_tokens < 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.limit }} has under 1 token left (upper bound on what is left)"
          description: >-
            This is an UPPER BOUND on what is left: it counts only this program's spend, while the
            per-domain and per-exact-set limits are global across accounts. The real remaining
            allowance can be smaller, never larger -- which is why the threshold is one token and
            not five. Stop configuration churn until it refills.

      # A revocation the CA has not accepted is an outstanding security action, not a background
      # task: it exists because someone decided a certificate must stop being trusted.
      - alert: WecertRevocationPending
        expr: wecert_revocation_pending > 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} revocation(s) have not been accepted by the CA"
          description: >-
            The decision is durable and retried every pass, so this is a failing request rather than a
            lost one. Check the daemon log for the CA's response; a rejected reason code will never
            succeed on its own.

      # wecert_revocation_pending holds its last value when the read behind it fails, so a store
      # problem freezes that gauge instead of zeroing it. This is the alert that says the gauge is no
      # longer trustworthy -- without it, a daemon that has been unable to look at its own revocation
      # queue for a week looks exactly like one with nothing to do.
      - alert: WecertRevocationQueueUnreadable
        expr: increase(wecert_revocation_query_errors_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "wecert cannot read its outstanding revocations; wecert_revocation_pending is stale"
          description: >-
            The reconciler could not list the outstanding revocation requests, so it skipped the retry
            for this pass and left wecert_revocation_pending at its previous value. Check state.db and
            the disk it lives on. If that gauge is non-zero it is still a real outstanding revocation;
            if it is zero it means "unknown", not "clear".
