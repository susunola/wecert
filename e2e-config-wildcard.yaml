# End-to-end test config — stage A: wildcard
#
# This stage needs no cloud resources at all: a wildcard can only use DNS-01, so
# the whole run is DNS API calls, and issuing the certificate and uploading it to
# Tencent Cloud SSL Certificate Service is also just API calls — no CLB binding
# needed.
#
# The core thing under test is the wildcard + apex interaction:
#   the challenge values for example.com and *.example.com both go on
#   _acme-challenge.example.com and must exist at the same time.
#   An implementation that does "write one, validate one, delete one" is
#   guaranteed to fail here.

statePath: /tmp/wecert-e2e/state.db

acme:
  directory: https://acme-staging-v02.api.letsencrypt.org/directory
  email: REPLACE_ME

dns:
  provider: tencentcloud

tencent:
  credentialMode: static

  resourceTypes:
    - clb

  regions:
    - ap-guangzhou

certificates:
  - name: wildcard-test
    # classic: 90 days, Max Names 100.
    # Once it works, switch to tlsserver (45 days, Max Names 25) to verify profile
    # selection again.
    profile: classic
    keyType: ecdsa-p256
    domains:
      # The key point: request the apex and the wildcard together. Only when both
      # are present does it trigger "two authorizations writing the same TXT name".
      - REPLACE_ME
      - "*.REPLACE_ME"
    deploy:
      # Only when enabled does it upload to Tencent Cloud SSL Certificate Service.
      # On first issuance OldCertificateId is empty, so no existing resource is updated.
      enabled: true
