# 端到端测试配置 —— 阶段 A：wildcard
#
# 这个阶段不需要任何云资源：通配符只能走 DNS-01，全程只有 DNS API 调用；
# 证书签出来上传到腾讯云 SSL 证书服务也只是 API 调用，不需要绑定到 CLB。
#
# 验证的核心是 wildcard + apex 的交互：
#   example.com 和 *.example.com 的 challenge 值
#   都写在 _acme-challenge.example.com 上，必须同时存在。
#   "写一条→验一条→删一条"的实现会在这里必败。

statePath: /tmp/wecert-e2e/state.db

acme:
  directory: https://acme-staging-v02.api.letsencrypt.org/directory
  email: REPLACE_ME

dns:
  provider: tencentcloud

tencent:
  credentialMode: static

  resourceTypes:
    - clb

  regions:
    - ap-guangzhou

certificates:
  - name: wildcard-test
    # classic：90 天、Max Names 100。
    # 跑通后可以改成 tlsserver（45 天、Max Names 25）再验一遍 profile 选择。
    profile: classic
    keyType: ecdsa-p256
    domains:
      # 关键：apex 和通配符一起申请。
      # 只有这两个同时存在，才会触发"两条 authorization 写同一个 TXT 名字"。
      - REPLACE_ME
      - "*.REPLACE_ME"
    deploy:
      # 开着才会上传到腾讯云 SSL 证书服务。
      # 首次签发时 OldCertificateId 为空，不会更新任何已有资源。
      enabled: true
