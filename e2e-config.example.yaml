# Config for the end-to-end test only (L1)
#
# It does two things:
#   1. really issue a certificate with Let's Encrypt staging (no production quota used)
#   2. upload the certificate to Tencent Cloud SSL Certificate Service
#
# It deliberately binds no CLB: OldCertificateId is empty on first issuance, so
# UpdateCertificateInstance is never called and live traffic is never touched.
#
# Credentials are not written in this file; they come from the environment. Put them in
# a file only you can read and source it, e.g.:
#   export TENCENTCLOUD_SECRET_ID=...
#   export TENCENTCLOUD_SECRET_KEY=...
# scripts/run-stage-ab.sh reads ${WECERT_CREDS:-$HOME/.wecert/tencent.env} if you want a
# convention to copy.

statePath: /tmp/wecert-e2e/state.db

acme:
  # The end-to-end test must use staging. e2e-test.sh enforces this line.
  directory: https://acme-staging-v02.api.letsencrypt.org/directory
  # Put in a mailbox you can actually receive mail at; LE rejects reserved domains like example.com.
  email: REPLACE_ME

dns:
  # Use Tencent Cloud CAM credentials for DNS-01, sharing one set of credentials
  # with certificate deployment.
  provider: tencentcloud

tencent:
  # static: read AK/SK from the environment, never written into this file.
  credentialMode: static
  # cvm-role (recommended in production):
  # credentialMode: cvm-role
  # roleName: wecert-role

  resourceTypes:
    - clb

  # The region your test domain lives in. L1 does not actually use it, but it is
  # needed to pass config validation (CLB is a regional resource).
  regions:
    - ap-guangzhou

metrics:
  listen: 127.0.0.1:9800

certificates:
  - name: e2e-test
    # classic: 90 days, Max Names 100 — confirm the basic flow first.
    # Once it works, switch to tlsserver (45 days, Max Names 25) and verify again.
    profile: classic
    keyType: ecdsa-p256
    domains:
      # Replace with your test domain. It is best to get a single name working
      # first, then add the wildcard to exercise the path where wildcard + apex
      # share one TXT name.
      - REPLACE_ME
    deploy:
      # L1 needs to verify the "upload to Tencent Cloud" step, so this is on.
      # First issuance only calls UploadCertificate and updates no existing resource.
      enabled: true
