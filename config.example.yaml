# wecert example config
#
# Security note: this file holds a DNSPod token, so chmod 600 it and make sure it
# is owned by the user that runs wecert.
# Tencent Cloud credentials default to the CVM role (temporary credentials, never
# written to disk), so there is no need to put SecretId/SecretKey here.

statePath: /var/lib/wecert/state.db

# Periodic consistent snapshots of state.db, written beside it.
#
# Why this is on by default: state.db holds the ACME account key and every in-flight order
# URL. Losing it does not just cost an issuance -- accounts are limited to 10 per IP per 3
# hours, and a re-placed order counts against "5 certificates per exact set of identifiers /
# 7 days", a limit with no override. Until this existed the only guidance was a README line
# saying it is the one thing to back up.
#
# Snapshots use SQLite's VACUUM INTO, not a file copy: the database runs in WAL mode, so a
# copy of state.db alone can miss everything committed since the last checkpoint -- which is
# exactly the order URL you would be trying to recover.
stateBackup:
  enabled: true
  interval: 24h
  # How many snapshots to keep, newest first. Each is a full copy of the database.
  keep: 7
  # Defaults to the directory holding state.db (already 0700). Point it elsewhere if you
  # want the primary copy on separate storage.
  # dir: /var/backups/wecert
  # Additional independent local destinations, such as another physical disk or backup volume.
  # Each receives its own SQLite-consistent snapshot and retention set.
  # localDirs:
  #   - /mnt/backup-disk/wecert
  # Off-host destinations. S3 credentials use the standard AWS environment/profile chain;
  # COS uses its S3-compatible endpoint and the same credential chain.
  # remoteTargets:
  #   - name: production-s3
  #     type: s3
  #     bucket: wecert-backups
  #     prefix: production
  #     region: ap-southeast-1
  #     keep: 7
  #     timeout: 5m
  #   - name: tencent-cos
  #     type: cos
  #     bucket: wecert-1250000000
  #     endpoint: https://cos.ap-guangzhou.myqcloud.com
  #     region: ap-guangzhou
  #   - name: offsite-sftp
  #     type: sftp
  #     host: backup.example.net:22
  #     username: wecert
  #     remoteDir: /srv/wecert
  #     privateKeyFile: /etc/wecert/backup_ed25519
  #     # privateKeyPassphraseEnv: WECERT_SFTP_KEY_PASSPHRASE
  #     knownHostsFile: /etc/wecert/backup_known_hosts

acme:
  # ⚠️ Defaults to staging. install.sh installs this very file as
  #    /etc/wecert/config.yaml, so the default has to be the safe one: if the
  #    default pointed at production, a user following the README through a
  #    single -dry-run would already have registered a real ACME account in
  #    production (quota: 10 per IP per 3 hours).
  #
  #    Get the whole flow working with the directory below first, confirming
  #    that DNS-01, deployment and ARI all behave, then switch explicitly to the
  #    production directory:
  #      https://acme-v02.api.letsencrypt.org/directory
  directory: https://acme-staging-v02.api.letsencrypt.org/directory

  # ⚠️ Replace this with a mailbox you can read. It is where the CA sends expiry and
  #    revocation notices, and Let's Encrypt REFUSES the reserved documentation domains
  #    (example.com, example.net, example.org, ...) when it registers the account: the
  #    error is `contact email has forbidden domain`, and nothing is issued at all.
  #
  #    wecert rejects those names locally too, with that reason, so an unedited file fails
  #    at once instead of at the CA -- install.sh's final step is exactly this -dry-run.
  email: ops@example.com

dns:
  # ── pick one; each uses its own credential system, do not mix them up ──
  #
  #   tencentcloud  uses Tencent Cloud CAM credentials (the tencent section
  #                 below) and calls dnspod.tencentcloudapi.com. Recommended: it
  #                 can share one set of credentials with certificate deployment,
  #                 supports SessionToken, and can run off the CVM role.
  #
  #   dnspod        uses DNSPod's own API Token (dnspod.cn -> key management) and
  #                 calls dnsapi.cn. Note this is **not** a Tencent Cloud
  #                 SecretId/SecretKey.
  #
  #   cloudflare    uses a scoped Cloudflare API token and calls api.cloudflare.com.
  #                 Built into every binary: no -tags lego_dns rebuild, and no
  #                 `legoProvider` indirection.
  #
  #   route53       uses AWS credentials and calls Route 53. Built in as well. With
  #                 no static keys configured it uses the AWS SDK's default
  #                 credential chain, so an EC2 instance role needs nothing on
  #                 disk.
  provider: tencentcloud

  # Required when provider=dnspod. Looks like "12345,abcdef0123456789..."
  #
  # Prefer ONE of the two below over this: a token written here is a token in every backup of
  # this file and every time somebody pastes it while debugging.
  #
  #   loginTokenFile  reads it from a file (0600), and the path is environment-expanded, so
  #                   systemd's LoadCredential works:
  #                       # /etc/systemd/system/wecert.service.d/credentials.conf
  #                       [Service]
  #                       LoadCredential=dnspod-token:/etc/wecert/dnspod.token
  #                   with `loginTokenFile: ${CREDENTIALS_DIRECTORY}/dnspod-token` here.
  #
  #   DNSPOD_LOGIN_TOKEN in the environment is also accepted when neither is set, for a container
  #   or an EnvironmentFile= that is itself 0600.
  #
  # loginToken: ""
  # loginTokenFile: ${CREDENTIALS_DIRECTORY}/dnspod-token

  # ── cloudflare (provider: cloudflare) ───────────────────────────────────────────────
  #
  # A scoped API token, not the legacy global API key: create one in the Cloudflare dashboard
  # (My Profile -> API Tokens) with Zone:Read and DNS:Edit on the zone(s) that hold the
  # challenge names. The token never expires, so it is read once at startup.
  #
  #   apiTokenFile  reads it from a file (0600) instead; the path is environment-expanded, so
  #                 systemd's LoadCredential works the same way as for the DNSPod token:
  #                     [Service]
  #                     LoadCredential=cloudflare-token:/etc/wecert/cloudflare.token
  #                 with `apiTokenFile: ${CREDENTIALS_DIRECTORY}/cloudflare-token` here.
  #
  #   CLOUDFLARE_DNS_API_TOKEN is also accepted when neither is set, and CF_DNS_API_TOKEN (the
  #   short alias lego also documents) as well.
  #
  # Setting both apiToken and apiTokenFile is refused rather than guessed at.
  #
  # cloudflare:
  #   apiToken: ""
  #   apiTokenFile: ${CREDENTIALS_DIRECTORY}/cloudflare-token

  # ── route53 (provider: route53) ─────────────────────────────────────────────────────
  #
  # region is required: Route 53 is a global service, but the AWS SDK refuses to sign a request
  # without a region. AWS_REGION (or AWS_DEFAULT_REGION) in the environment is accepted instead.
  #
  # hostedZoneId is optional. Empty means the public hosted zone is looked up from the challenge
  # name, which is what a wildcard + SAN certificate wants; set it to pin one zone, or leave
  # AWS_HOSTED_ZONE_ID in the environment (still honoured) if that is how the zone was pinned
  # before.
  #
  # Credentials, two shapes:
  #
  #   no static keys   the AWS SDK's default chain is used: AWS_ACCESS_KEY_ID /
  #                    AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN, then ~/.aws/credentials and
  #                    ~/.aws/config, then the instance role. This is the shape to use on an EC2
  #                    instance with a role attached -- nothing on disk, nothing to rotate.
  #
  #   accessKeyId +    an explicit static pair, which then replaces the chain. secretAccessKeyFile
  #   secretAccessKey  reads the secret from a 0600 file (environment-expanded). sessionToken /
  #                    sessionTokenFile belong to a pair that came from STS or an assumed role;
  #                    with the default chain the SDK fetches its own, so a token without the
  #                    pair is refused at load time.
  #
  # route53:
  #   region: us-east-1
  #   # hostedZoneId: Z0123456789ABCDEFGHIJ       # empty: look the zone up from the FQDN
  #   # accessKeyId: "AKIA..."
  #   # secretAccessKeyFile: ${CREDENTIALS_DIRECTORY}/aws-secret
  #   # sessionToken: ""

  # TTL of the TXT record.
  # ⚠️ The DNSPod free tier has a TTL floor of 600; a value of 60 is rejected by
  #    the API (LimitExceeded.RecordTtlLimit). Paid tiers can go lower.
  #    Cloudflare's own floor is 120 and is enforced at load time.
  ttl: 600
  # Upper bound on waiting for the TXT to become visible on every authoritative
  # NS after it is written. LE validates from multiple vantage points and only
  # passes when they all agree, so this step cannot be skipped.
  propagationTimeout: 5m
  pollingInterval: 5s

  # Optional trusted recursive resolvers used consistently for CNAME, SOA and
  # NS discovery before wecert queries the discovered authoritative NS directly.
  # Leave empty to read /etc/resolv.conf. Use IP literals (optionally :port),
  # not hostnames, so resolver discovery cannot silently fall back to another
  # local DNS view (VPN / split-horizon / captive resolver).
  # recursiveNameservers: ["1.1.1.1", "8.8.8.8"]

# ---------------------------------------------------------------------------
# Where issued certificates are deployed.
#
# tencent (default): upload to Tencent Cloud and rebind the CLB listener. First
#   issuance needs a one-time manual bind in the console; renewals are automatic.
# nginx: write fullchain.pem + privkey.pem on disk and reload nginx. There is no
#   cloud certificate and no console step -- the files nginx's ssl_certificate
#   points at *are* the deployment. Use this when TLS terminates on the same
#   machine as wecert (a VM running nginx), not at a cloud LB.
#
# One process, one backend: split the fleet across two configs if you need both.
#deploy:
#  target: nginx

# nginx layout (read only when deploy.target is nginx).
#nginx:
#  # %s is the certificate name (not the first domain -- names can contain '*').
#  dirTemplate: /etc/nginx/ssl/%s
#  certFile: fullchain.pem
#  keyFile: privkey.pem
#  # argv, never a shell string. Empty list = write files and do not reload.
#  reload:
#    - systemctl
#    - reload
#    - nginx
#
#   The wecert systemd unit runs as user wecert and cannot reload nginx by
#   itself. Either a sudoers rule for exactly that command, a helper script, or
#   reload: [] and a cron/systemd path of your own.

tencent:
  # cvm-role: fetch temporary credentials from the instance metadata service
  #           (recommended; no key ever touches disk)
  # static  : fill in secretId / secretKey below (for local debugging, or when
  #           dns.provider=tencentcloud)
  credentialMode: cvm-role
  roleName: wecert-role

  # credentialMode: static
  # secretId: "REPLACE_ME"
  # secretKey: "REPLACE_ME"
  #
  # File variants, for the same reason as loginTokenFile above; both paths are
  # environment-expanded so LoadCredential works:
  # secretIdFile: ${CREDENTIALS_DIRECTORY}/tencent-secret-id
  # secretKeyFile: ${CREDENTIALS_DIRECTORY}/tencent-secret-key

  # Resource types that UpdateCertificateInstance supports.
  # clb is the most common; cdn, waf, tke, apigateway and others also work.
  resourceTypes:
    - clb

  # CLB is a regional resource, so list every region where you have a CLB: a
  # region left out is never updated, and the certificates there expire silently.
  regions:
    - ap-guangzhou
    - ap-shanghai

  # Optional Tencent Cloud account id (UIN). The inventory page groups
  # certificates by it. A certificate-level `uin` in the desired-state
  # document overrides this when more than one account is in view.
  # uin: "100012345678"

metrics:
  listen: 127.0.0.1:9800

# ── source of desired state (optional) ──────────────────────────────────────
# Decides **who has the final say over what certificates should exist**.
# Empty = static, i.e. the certificates list below decides, exactly as before.
#
# The migration path is static -> observe -> enforce; do not skip a step:
#
#   static   the certificates list in the config decides. Zero risk.
#   observe  still converges on certificates, but **additionally** reads the
#            document and reports differences. It issues nothing; it only answers
#            "what would be added or removed if the document had its way".
#            Let it run for two weeks first: drift rate, whether there are bulk
#            imports, whether there are odd records — that data directly drives
#            the debounce window, group size and circuit-breaker thresholds.
#            Guessing these parameters wrong costs account-level rate limiting.
#   enforce  the document decides. Here certificates must be empty, or config
#            loading fails outright.
#
# desiredState:
#   mode: observe
#   path: /var/lib/wecert/desired-state.yaml
#   # Alert when the document has not been refreshed for this long. This is the
#   # failure mode this architecture newly introduces: after onboarding dies,
#   # wecert keeps renewing happily from the stale document and everything looks
#   # fine — new domains simply never come in again.
#   maxStaleness: 48h

# ── onboarding policy (optional) ────────────────────────────────────────────
# Read only by wecert-onboard; wecert itself never looks at this section.
# These numbers decide how fast quota is consumed and how conservative deletion
# is, which is why they live in config rather than code — they are meant to be
# tuned from real drift data.
#
# onboarding:
#   # Empty = enumerate every zone in the account.
#   zones: [example.com]
#
#   # Guard 1: a declaration only takes effect if a CLB rule backs it too,
#   # default true. It blocks "declared but the rule is not configured yet"
#   # (which would cause one useless issuance) and misspelled domains.
#   requireCLBRule: true
#
#   # Registered domains allowed to get certificates, normalized to eTLD+1.
#   # Empty = unrestricted. This is an explicit-authorization guardrail that
#   # bounds the blast radius of "some script wrote 500 declarations in bulk".
#   allowlist: [example.com]
#
#   # SAN cap per certificate. 25 is recommended, aligned with tlsserver, so
#   # switching profiles later needs no architectural change. Domains on one
#   # certificate live and die together.
#   maxNames: 25
#   profile: classic
#   keyType: ecdsa-p256
#   deploy: true
#
#   # How long a name must be **confirmed** missing before it may be removed from
#   # a certificate. Adding is convergence, removing is a decision, and the two
#   # differ by an order of magnitude in how conservative they should be: dropping
#   # a domain because one DNS query flapped and signing it back adds up to three
#   # issuances for a single rollout.
#   gracePeriod: 24h
#
#   # Allowed set changes within the window. LE allows 50 per registered domain
#   # per 7 days and shares that across accounts, so the budget takes half.
#   budget: 25
#   budgetWindow: 168h
#
#   # Freeze and alert when the declared set shrinks by more than this fraction in
#   # one step. A normal decommission does not cut the set by 30%; a sudden 30%
#   # drop almost always means something upstream broke (incomplete API response,
#   # changed permissions, a failed zone read), and acting on it would strip SANs
#   # in bulk.
#   dropThreshold: 0.30
#
#   # The ledger for grace periods and budget. It must be persisted: onboarding is
#   # a run-once-and-exit process, and an in-memory grace period does not survive
#   # a restart, which means it would never elapse.
#   statePath: /var/lib/wecert/onboard-state.json
#   reportPath: /var/lib/wecert/desired-state.report.json

# ── network-side certificate probe (optional, on by default) ────────────────
# The cloud API saying "bind succeeded" and a browser actually getting that
# certificate are two different things: the former goes through the control plane,
# the latter requires dialing a real TLS connection.
#
# Failures the control plane cannot see, which only a dial reveals:
#   - the rebind is asynchronous (about 15 seconds in practice), so when the API
#     says success the edge may still be serving the old certificate
#   - another certificate on the CLB is winning SNI
#   - the rebind never happened and the API simply reported no error
#
# On by default. If wecert runs on a machine that cannot reach the CLB VIP, turn
# it off: in that situation wecert_certificate_probe_errors_total goes up while
# wecert_certificate_probe_match stays flat — it will not make certificates look
# broken.
#
# probe:
#   enabled: true
#   port: 443
#   # Cross-AZ handshakes routinely take 3-5 seconds. Setting this too low
#   # produces frequent false alarms, and false alarms train people to ignore
#   # alerts, which is worse than not probing at all.
#   timeout: 10s
#   # Maximum number of names to dial per certificate. Not all of them: dialing
#   # all 25 names of a 25-name certificate every round has diminishing returns
#   # and linearly growing cost.
#   # An explicit 0 means "dial nothing" (pause probing without disabling it --
#   # enabled: false removes the prober entirely). It used to be rewritten to the
#   # default on load, so writing 0 silently kept probing three hosts per cert.
#   maxHostsPerCert: 3
#   # Whether a chain that does not verify against the system roots counts as a
#   # failed probe. On by default: "the right certificate, in the right place,
#   # still broken" is a real shape — a listener serving the leaf without its
#   # intermediate passes every other check and fails in every real client.
#   # Set it to false when the CA is internal: those certificates never verify
#   # against the public roots, so the strict answer is a permanent mismatch
#   # that trains everyone to ignore this alert.
#   requireTrusted: true
#   # Empty means do not check remaining validity. This check is redundant, but it
#   # fails differently: it verifies "the edge really is serving a non-expired
#   # certificate" rather than "I believe a non-expired certificate was deployed".
#   # minValidFor: 168h

# ── degradation before expiry (optional, off by default) ────────────────────
# When a few names on a certificate keep failing to validate and it is close to
# expiry, drop those names, issue the certificate now and save the rest. Partial
# availability beats total failure.
#
# Why it is needed: one misconfigured DNS record out of 25 names makes the whole
# certificate impossible to issue — and the other 24 perfectly good names expire
# along with it.
#
# ⚠️ Off by default, because it changes what a certificate covers, and that is a
#    security decision a program should not make for a person. Once enabled, the
#    dropped names lose coverage, and what degrades is the security of **those
#    names**, not of this certificate. It logs at ERROR level and stays visible in
#    the metrics.
#
# It only drops names where a **specific identifier** keeps failing. When it is not
# known which name is broken it never degrades — dropping at random would
# sacrifice good names too, which is worse than not degrading.
#
# failureFallback:
#   enabled: false
#   # Consecutive failures of this certificate before degradation is considered.
#   afterFailures: 5
#   # How close to expiry degradation is considered. It cannot be set too large:
#   # degrading early swaps a still fully valid certificate for one missing names,
#   # which is a net loss.
#   beforeExpiry: 168h
#   # Minimum failures for one identifier before it may be dropped. Setting it to
#   # 1 would drop a name on a single network blip.
#   minIdentifierFailures: 3
#   # How long a failure record stays valid. It doubles as the self-healing
#   # mechanism: once the record ages out the name is no longer dropped, and the
#   # next round retries the full set — so after a fix the system recovers within
#   # at most this long, with no extra retry state.
#   failureWindow: 24h
#   # Minimum names kept after degradation. Below that it refuses to degrade: that
#   # is total failure wearing a different hat, while making people believe
#   # something is still partially available.
#   minNames: 1

# ── inventory console and event triggering (optional) ─────────────────────────────────────────────
# Disabled by default; convergence happens on the timer only. Configure it and
# external events can drive it, for example CI calling it once after a domain is
# added, instead of waiting for the next hour. This listener also serves the
# authenticated read-only console at GET /status and JSON at GET /api/inventory.
# Browser access and token handling: docs/console.md. No separate UI flag.
#
# webhook:
#   listen: 127.0.0.1:9801
#
#   # Required, at least 16 characters.
#   # This endpoint triggers **real issuance** and consumes Let's Encrypt rate
#   # limit quota, so it must never be left unprotected. A too-short token on this
#   # endpoint is as good as no authentication at all.
#   token: "REPLACE_ME_WITH_A_LONG_RANDOM_SECRET"
#
#   # Optional. When set, every renewal attempt ends by POSTing a JSON event to
#   # it, to wire "the certificate was renewed" into downstream flows (for example
#   # triggering a config reload).
#   # notifyURL: "https://ci.example.com/hooks/wecert"
#
#   # Optional, only meaningful with notifyURL, at least 32 characters.
#   # Each event then carries X-Wecert-Signature: sha256=<hex HMAC-SHA256 of the
#   # raw body>, so the receiver can tell a genuine event from anything else that
#   # can reach its URL. Generate one with: openssl rand -hex 32
#   # notifySecret: "REPLACE_ME_WITH_A_LONG_RANDOM_SECRET"

certificates:
  # ── one certificate = one set of domains that live and die together ──────
  # Domains on the same certificate succeed together, fail together and expire
  # together. Do not stuff unrelated services onto one certificate, or a single
  # domain's DNS failure drags all of them down.
  #
  # Keep each certificate to 25 domains or fewer: that leaves headroom and also
  # aligns with the tlsserver profile's Max Names (25), so switching profiles
  # later needs no architectural change.

  - name: example-com
    # profile decides Max Names: classic=100 (90 days), tlsserver=25 (45 days).
    # The long-term direction is tlsserver — the BR schedule requires all
    # certificates to be <=47 days from 2029-03-15.
    profile: classic
    keyType: ecdsa-p256
    # Optional; by default derived from the profile: classic=30d, tlsserver=15d.
    # Only a fallback for when ARI is unavailable.
    # renewBefore: 30d
    domains:
      - example.com
      - "*.example.com"
    deploy:
      enabled: true
    # Optional private-key export. Each certificate gets an isolated directory
    # containing fullchain.pem and privkey.pem, both written atomically as 0600.
    # Remote targets use the same credential references and host-key checking as
    # stateBackup.remoteTargets; their object/directory path gains /example-com.
    # export:
    #   localDir: /var/lib/wecert/export
    #   remoteTargets:
    #     - name: cert-archive
    #       type: s3
    #       bucket: wecert-certificates
    #       prefix: production
    #       region: ap-southeast-1
    #     - name: offsite-sftp
    #       type: sftp
    #       host: backup.example.net:22
    #       username: wecert
    #       remoteDir: /srv/wecert/certificates
    #       privateKeyFile: /etc/wecert/export_ed25519
    #       knownHostsFile: /etc/wecert/backup_known_hosts
    # A certificate can also override the global failureFallback policy; an
    # explicit false protects a critical certificate from subset issuance.
    # failureFallback:
    #   enabled: false

  # A wildcard covers exactly one label: *.example.com does not include
  # a.b.example.com. Multi-level naming requires a separate certificate per
  # sub-zone.
  - name: api-example-com
    profile: tlsserver
    keyType: ecdsa-p256
    domains:
      - api.example.com
      - "*.api.example.com"
    deploy:
      enabled: true
