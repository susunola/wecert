name: release

on:
  push:
    tags: ['v*']

# contents: write is what the last step needs -- `gh release create` publishes the Release.
# id-token and attestations are for the provenance attestation below: the job mints an OIDC token
# that names this repository, workflow and commit, and the attestation API stores it alongside the
# artifact digests. Neither grants access to anything the job did not already have.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # VERSION comes from `git describe --tags`, so the checkout needs the tags themselves.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # A release is exactly the commit CI already gates on, but a tag can point anywhere --
      # re-run the gate so a tag placed on an untested commit cannot ship.
      - name: test
        run: make test

      - name: build artifacts
        run: make release

      # Provenance for the release binaries. `make repro-check` proves they can be rebuilt
      # bit-for-bit from this commit, but only for someone who does the rebuilding; this attaches a
      # signed statement -- built by this workflow, from this commit -- so a download can be
      # verified with `gh attestation verify dist/wecert_linux_amd64 --repo susunola/wecert`
      # instead of being trusted on the strength of the transport.
      #
      # `dist/*` is exactly what the publish step below uploads, so the Release, its SHA256SUMS and
      # the attestation cover the same bytes. This runs before the Release is created: an
      # attestation that cannot be produced should stop the publish, not follow it.
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      # CHANGELOG.md sections are headed "## 0.4.2 - 2026-09-16" (no v prefix); the release notes
      # are the section matching the tag. A tag with no changelog section fails here rather than
      # publishing an empty release.
      - name: extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " - " { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG.md section for $version"; exit 1; }
          cat release-notes.md

      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "wecert $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*
