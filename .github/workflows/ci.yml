name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # gofmt needs its own gate: go vet does not check formatting, so an
      # unformatted file sails through every other local check.
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "these files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      # wecert is an international project: every comment and every user-facing
      # message in the source is English. Without a gate, Chinese comments creep
      # back in one file at a time and nobody notices until a contributor asks
      # why half the reasoning is unreadable to them.
      - name: English source
        run: python3 scripts/check-english.py

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # -race matters more than usual here: on a certificate with many SANs the
      # DNS probing and the authorization polling are both concurrent, and a data
      # race shows up as "one domain's validation failed for no reason" — the
      # kind of thing a human review will never catch.
      - name: test
        run: go test -race ./...

      - name: build
        run: make build

      # Cross-compilation check: the release artifacts get dropped straight onto
      # a CVM, so do not wait until release day to find out they do not build.
      - name: cross build
        run: make release
