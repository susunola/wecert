# End-to-end test config — one certificate with 2 wildcard SANs + an SNI listener
#
# This scenario is much stricter than a single domain on a single listener:
#
#   1. one certificate covers 2 wildcards: *.alpha.<domain> and *.beta.<domain>
#      — each of the two authorizations writes its own _acme-challenge record
#   2. the certificate is bound to a listener with SNI enabled (going through
#      multi_cert_info, because with SniSwitch=true the server ignores the main
#      certificate_id)
#   3. the listener has a real CVM backend, so end-to-end TLS can be verified from
#      inside the VPC
#
# The core assumption under test: one UpdateCertificateInstance call should rebind
# every resource this certificate is bound to. Passing 1-to-1 does not mean 1-to-N
# will pass.
#
# Usage: replace REPLACE_ME with a real domain (for example atomwangnus.com).

statePath: /tmp/wecert-e2e/state.db

acme:
  # The end-to-end test must use staging; otherwise failed retries burn real production quota.
  directory: https://acme-staging-v02.api.letsencrypt.org/directory
  email: REPLACE_ME

dns:
  # Use Tencent Cloud CAM credentials for DNS-01, sharing one set of credentials
  # with certificate deployment.
  provider: tencentcloud

tencent:
  # static: read from TENCENTCLOUD_SECRET_ID / SECRET_KEY in the environment, never written into this file.
  credentialMode: static

  resourceTypes:
    - clb

  # CLB is a regional resource, so list every region where you have a CLB.
  regions:
    - ap-guangzhou

certificates:
  - name: two-san-wildcard
    # classic: 90 days, Max Names 100.
    # Two wildcards use only 2 identifiers, far from the cap; the real constraint
    # is "domains on one certificate live and die together".
    profile: classic
    keyType: ecdsa-p256
    domains:
      # The two wildcards are validated independently.
      # Note a wildcard covers exactly one label: *.alpha.<domain> does not include
      # x.y.alpha.<domain>.
      - "*.alpha.REPLACE_ME"
      - "*.beta.REPLACE_ME"
    deploy:
      enabled: true
